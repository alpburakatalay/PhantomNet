<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sorgu Paneli</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1220;
        color: #fff;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
    }

    h1 {
        margin-bottom: 20px;
    }

    .card {
        background: #111a2e;
        border: 1px solid #1f2a44;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .row {
        display: flex;
        gap: 10px;
    }

    input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #2a3b5f;
        background: #0c1528;
        color: white;
        outline: none;
    }

    button {
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: #3b82f6;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #2563eb;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        background: #0c1528;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 8px;
        border: 1px solid #1f2a44;
    }

    .muted {
        color: #94a3b8;
    }

    .tag {
        display:inline-block;
        font-size:12px;
        padding:2px 6px;
        border-radius:6px;
        background:#1f2a44;
        margin-left:8px;
    }

    .nav {
        text-align:center;
        margin-top: 20px;
    }

    .nav a {
        display:inline-block;
        padding:10px 15px;
        background:#22c55e;
        color:white;
        text-decoration:none;
        border-radius:8px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Sorgu Paneli</h1>

    <div class="card">
        <div class="row">
            <input id="query" type="text" placeholder="İsim, şehir veya ID yaz..." />
            <button onclick="search()">Ara</button>
        </div>
    </div>

    <div class="card">
        <h2>Veritabanı Sonuçları</h2>
        <ul id="results">
            <li class="muted">Arama bekleniyor...</li>
        </ul>
    </div>

    <div class="nav">
        <a href="phantom.html">PhantomNet Aç ➜</a>
    </div>
</div>

<script>
const database = [
    { id: 1, name: "Gökalp Çatal", city: "15331170988", role: "Yok" },
    { id: 2, name: "Yuşa Yağız Görgülü", city: "11545153588", role: "Yok" },
    { id: 3, name: "Yusuf Burak Ölmez", city: "17420977164", role: "Yok" },
    { id: 4, name: "İrem Köse", city: "19798020602", role: "Yok" },
    { id: 5, name: "İpek Derin Şahin", city: "15544011900", role: "Yok" },
    { id: 6, name: "Emir Kara", city: "USER-001", role: "Yok" },
    { id: 7, name: "Hidayet Mert Doğan", city: "USER-002", role: "Yok" },
    { id: 8, name: "Yağmur Ada Kaplan", city: "USER-003", role: "Yok" },

    { id: 10, name: "Cemal Ege Demirel", city: "USER-005", role: "Yok" },

    { id: 13, name: "Atlas Çelik", city: "USER-008", role: "Yok" },

];

function search() {
    const q = document.getElementById("query").value.toLowerCase().trim();
    const results = document.getElementById("results");

    results.innerHTML = "";

    if (!q) {
        results.innerHTML = '<li class="muted">Boş sorgu girildi.</li>';
        return;
    }

    const filtered = database.filter(item =>
        item.name.toLowerCase().includes(q) ||
        item.city.toLowerCase().includes(q) ||
        item.id.toString().includes(q) ||
        item.role.toLowerCase().includes(q)
    );

    if (filtered.length === 0) {
        results.innerHTML = '<li class="muted">Sonuç bulunamadı.</li>';
        return;
    }

    filtered.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `<b>${item.name}</b> <span class="tag">#${item.id}</span><br/>${item.city} - ${item.role}`;
        results.appendChild(li);
    });
}
</script>

</body>
</html>
